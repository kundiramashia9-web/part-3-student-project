
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Best Cakes | Enquiry</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Best Cakes</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Enquiry Form -->
    <main class="form-page">

        <section class="form-panel">

            <h1>Make an Enquiry</h1>

            <p class="section-description">
                Tell us about your cake requirements, and we will help
                you plan something special.
            </p>

            <form id="enquiryForm">

                <div class="form-grid">

                    <div class="form-field">
                        <label for="fullName">Full Name *</label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="email">Email Address *</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone Number *</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="cakeType">Choose Your Cake *</label>

                        <select id="cakeType" name="cakeType" required>
                            <option value="">-- Select a cake --</option>
                            <option value="Chocolate Cake">Chocolate Cake</option>
                            <option value="Strawberry Cake">Strawberry Cake</option>
                            <option value="Birthday Cake">Birthday Cake</option>
                            <option value="Vanilla Cake">Vanilla Cake</option>
                            <option value="Custom Cake">Custom Cake</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="cakeSize">Cake Size *</label>

                        <select id="cakeSize" name="cakeSize" required>
                            <option value="">-- Select a size --</option>
                            <option value="Small">Small</option>
                            <option value="Medium">Medium</option>
                            <option value="Large">Large</option>
                            <option value="Extra Large">Extra Large</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="eventDate">Required Date *</label>

                        <input
                            type="date"
                            id="eventDate"
                            name="eventDate"
                            required
                        >
                    </div>

                    <div class="form-field full-width">
                        <label for="message">Additional Details</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Tell us about the design, flavour, colours, or occasion..."
                        ></textarea>
                    </div>

                </div>

                <button type="submit" class="btn submit-btn">
                    Submit Enquiry
                </button>

                <p class="form-note">
                    Fields marked with * are required.
                </p>

                <p id="formMessage" role="status"></p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Best Cakes. All rights reserved.</p>
    </footer>

    <!-- Enquiry Form Script -->
    <script>
        const cakeType = document.getElementById("cakeType");
        const eventDate = document.getElementById("eventDate");
        const enquiryForm = document.getElementById("enquiryForm");
        const formMessage = document.getElementById("formMessage");

        // Set the earliest available date to today.
        const today = new Date();
        const localToday = new Date(
            today.getTime() - today.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        eventDate.min = localToday;

        // Select a cake automatically if the visitor clicked
        // an Enquire Now button on the homepage.
        const parameters = new URLSearchParams(window.location.search);
        const selectedCake = parameters.get("cake");

        if (selectedCake) {
            cakeType.value = selectedCake;

            if (cakeType.value !== selectedCake) {
                cakeType.value = "Custom Cake";
            }
        }

        enquiryForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!enquiryForm.checkValidity()) {
                enquiryForm.reportValidity();
                return;
            }

            const formData = new FormData(enquiryForm);

            const fullName = formData.get("fullName");
            const email = formData.get("email");
            const phone = formData.get("phone");
            const cake = formData.get("cakeType");
            const size = formData.get("cakeSize");
            const date = formData.get("eventDate");
            const message = formData.get("message");

            const subject = "Best Cakes - New Enquiry";

            const body =
                "New Cake Enquiry\n\n" +
                "Name: " + fullName + "\n" +
                "Email: " + email + "\n" +
                "Phone: " + phone + "\n" +
                "Cake: " + cake + "\n" +
                "Size: " + size + "\n" +
                "Required Date: " + date + "\n" +
                "Additional Details: " + message;

            formMessage.textContent =
                "Your email application will open so you can send your enquiry.";

            window.location.href =
                "mailto:?subject=" +
                encodeURIComponent(subject) +
                "&body=" +
                encodeURIComponent(body);
        });
    </script>

</body>
</html>
